name: Validate Spectra Hotkey Defaults

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hotkey-defaults:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate disabled-by-default hotkey flags
        run: node tests/hotkey-defaults.mjs
